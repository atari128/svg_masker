<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>Masked jpg inside SVG</h1>
  <div style="border: 1px solid grey; margin: 1em; padding: 0.5em; width: fit-content;">Embed a jpeg image inside SVG with another jpeg as opacity mask. The mask needs to be black and white where white is the visible part. Both images should be of the same aspect ratio.</div>

  <label for="inputImage">Image</label>
  <input id="inputImage" type="file" />
  <label for="inputMask">Mask</label>
  <input id="inputMask" type="file" />
  <button onclick="makeSVG();">Ok</button>
  <div id="imgTest"></div>
  </svg>
</body>
<script>
  // capture the image from input file

  // turn it in to base 64

  // create svg with mask and image

  const svg1 = `<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- mask -->
      <mask id="svg_mask" maskUnits='userSpaceOnUse' maskContentUnits='userSpaceOnUse' >
        <image width="100%" height="100%" href="`;

  const svg2 = `" />
      </mask>
    </defs>
    <!-- Image -->
    <image mask="url(#svg_mask)" width="100%" height="100%" href="`;
  const svg3 = `" />
  </svg>
`;

  function reafFile(file) {
    return new Promise(function (resolve, reject) {
      let fr = new FileReader(); 

      fr.onload = function (fileLoadedEvent) {
        let srcData = fileLoadedEvent.target.result;
        resolve(srcData);
      };

      fr.onerror = function () {
        reject(fr)
      };

      fr.readAsDataURL(file); 
    });
  }

  function makeSVG() {
    const imageFile = document.getElementById("inputImage").files;
    const maskFile = document.getElementById("inputMask").files;

    if (imageFile.length > 0 && maskFile.length > 0) {
      const image = imageFile[0];
      const mask = maskFile[0];
      let files = [image, mask];
      let readers = [];

      for(let i = 0;i < files.length;i++){
        readers.push(reafFile(files[i]));
      }

      Promise.all(readers).then((values) => {
        const svg = svg1 + values[1] + svg2 + values[0] + svg3;
        console.log(svg)

        let img = document.createElement("img");
        img.src = "data:image/svg+xml;base64," + btoa(svg);
        document.getElementById("imgTest").innerHTML = img;


        const a = document.body.appendChild( document.createElement("a"));
        a.download = "export.svg";
        a.href = "data:image/svg+xml;base64," + btoa(svg);
        a.click();
      });
    }
  }

</script>

</html>
